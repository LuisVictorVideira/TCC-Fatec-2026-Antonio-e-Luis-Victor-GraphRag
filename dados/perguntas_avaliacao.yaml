  - relational-databases/partitions/partitioned-tables-and-indexes.md#chunk2
  resposta_resumo: >
    Faz o CREATE INDEX remover e recriar, numa operação só, o índice existente de mesmo nome,
    com a definição nova: outras colunas, outra ordem, outras opções, outro filegroup ou esquema
