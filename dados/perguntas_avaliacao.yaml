metadados:
  descricao: >
    Conjunto de avaliação: perguntas abertas, em inglês e em português, sobre administração
    do SQL Server, com a resposta anotada nos trechos do corpus. Foram redigidas 32 perguntas
    antes de qualquer consulta ao grafo; a A02 foi excluída porque a resposta está fora das
    duas pastas do corpus, e restaram estas 31.
  corpus: MicrosoftDocs/sql-docs, pastas relational-databases/ e t-sql/
  corpus_commit: 928a038ddb0ec8229674c7d0dbe9e529cbd42024
  impressao_digital_trechos: dfc1cb8893e7ad89b75df87b0da37983d59132d06670ce8364b683061e537b51
  total: 31
  grupos:
    A: controle
    B: impacto e dependência
    C: pré-requisitos e restrições
    D: comparação
  campos: |
    grupo: letra do id (A controle, B impacto e dependência, C pré-requisitos e restrições,
      D comparação).
    tipo: previsão feita antes da anotação (um_salto ou multi_salto).
    categoria: fato, impacto, prerequisito ou comparacao.
    escopo: resultado da anotação: um_trecho, multi_trecho_mesmo_doc ou multi_documento.
      multi_documento só quando nenhum documento sozinho basta.
    trivial_lexical: sim quando a pergunta nomeia o comando ou repete o título do documento,
      ou da seção, onde está a resposta. É propriedade da redação, e não do desempenho de
      um método. As não triviais formam o recorte principal da comparação.
    componentes: o ouro, organizado por informação necessária. Cada componente traz os
      trechos que contêm a informação, alternativos entre si: basta recuperar um.
    chunks_ouro: a união dos trechos dos componentes.
    chunks_apoio: trechos que ajudam, mas não bastam; bloco de sintaxe formal pode ser
      apoio, mas não ouro.
    resposta_resumo: resposta de referência, usada no julgamento das respostas.
    verificado: sim nas 31; os scripts só usam as perguntas com verificado: sim.
  aviso: >
    Os chunk_id dependem da fragmentação. Valem para o corpus no commit acima, fragmentado
    pelo chunking_e_mentions.py, cuja exportação tem a impressão digital acima.
