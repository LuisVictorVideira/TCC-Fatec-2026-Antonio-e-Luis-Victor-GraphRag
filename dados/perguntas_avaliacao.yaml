  - nome: nenhuma outra estatística da tabela é atualizada
    essencial: true
    trechos:
    - t-sql/statements/alter-index-transact-sql.md#chunk11
  chunks_ouro:
  - relational-databases/indexes/reorganize-and-rebuild-indexes.md#chunk2
  - relational-databases/indexes/reorganize-and-rebuild-indexes.md#chunk3
