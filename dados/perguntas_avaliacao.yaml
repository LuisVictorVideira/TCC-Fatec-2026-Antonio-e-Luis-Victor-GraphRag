  chunks_ouro:
  - t-sql/statements/create-columnstore-index-transact-sql.md#chunk3p0
  - t-sql/statements/create-columnstore-index-transact-sql.md#chunk3p1
  - t-sql/statements/create-index-transact-sql.md#chunk15
  - t-sql/statements/create-index-transact-sql.md#chunk2p1
  - t-sql/statements/create-json-index-transact-sql.md#chunk2
  - t-sql/statements/create-spatial-index-transact-sql.md#chunk2
  - t-sql/statements/create-xml-index-transact-sql.md#chunk2
  chunks_apoio:
