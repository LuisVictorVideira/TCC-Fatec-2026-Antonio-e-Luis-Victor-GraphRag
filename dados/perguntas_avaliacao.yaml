  resposta_resumo: >
    Não. Tabela memory-optimized tem índices próprios: hash e nonclustered de memória (Bw-tree),
    que não ficam em páginas de disco, não têm fill factor e são reconstruídos quando o banco
    volta. Não aceita índice clustered rowstore. O tipo em comum com a tabela comum é o columnstore,
