- id: B01
  grupo: B
  pergunta_pt: Se eu remover o índice clustered de uma tabela, o que acontece com a estrutura
    de armazenamento dela?
  pergunta_en: If I remove the clustered index from a table, what happens to its storage structure?
  tipo: multi_salto
  categoria: impacto
  saltos_esperados: 2
  justificativa_multihop: >
    O documento do DROP INDEX descreve o comando; a consequência de a tabela passar a ser
    um heap está documentada em outro lugar, junto com as características de um heap.
  docs_candidatos:
  - t-sql/statements/drop-index-transact-sql.md
  - relational-databases/indexes/heaps-tables-without-clustered-indexes.md
  componentes:
  - nome: removido o clustered, a tabela vira heap
    essencial: true
    trechos:
    - t-sql/statements/drop-index-transact-sql.md#chunk3
  chunks_ouro:
  - t-sql/statements/drop-index-transact-sql.md#chunk3
  chunks_apoio:
  - t-sql/statements/drop-index-transact-sql.md#chunk4
  resposta_resumo: >
    A tabela passa a ser um heap: a definição do índice sai dos metadados e as linhas que
    ficavam no nível folha do índice clustered passam a formar uma tabela sem ordem. O espaço
    que o índice ocupava é liberado; em índices com 128 extents ou mais, a desalocação física
    é adiada para depois do commit.
  verificado: sim
  escopo: um_trecho
  trivial_lexical: nao
- id: B02
  grupo: B
  pergunta_pt: Remover o índice clustered de uma tabela afeta os índices nonclustered que
    já existem nela?
  pergunta_en: Does removing a table's clustered index affect the existing nonclustered indexes?
  tipo: multi_salto
  categoria: impacto
  saltos_esperados: 2
  justificativa_multihop: >
    Exige combinar o comportamento de remoção do índice clustered com a documentação sobre
    como índices nonclustered referenciam as linhas — chave clustered contra identificador
    de linha.
  docs_candidatos:
  - t-sql/statements/drop-index-transact-sql.md
  - relational-databases/indexes/clustered-and-nonclustered-indexes-described.md
  componentes:
  - nome: remover o clustered reconstrói os nonclustered
    essencial: true
    trechos:
    - relational-databases/indexes/create-clustered-indexes.md#chunk2
    - relational-databases/indexes/reorganize-and-rebuild-indexes.md#chunk2
    - relational-databases/indexes/heaps-tables-without-clustered-indexes.md#chunk3
  chunks_ouro:
  - relational-databases/indexes/create-clustered-indexes.md#chunk2
  - relational-databases/indexes/heaps-tables-without-clustered-indexes.md#chunk3
  - relational-databases/indexes/reorganize-and-rebuild-indexes.md#chunk2
  chunks_apoio:
  - t-sql/statements/drop-index-transact-sql.md#chunk3
  - relational-databases/indexes/clustered-and-nonclustered-indexes-described.md#chunk0
  - relational-databases/sql-server-index-design-guide.md#chunk4
  resposta_resumo: >
    Sim. Remover o índice clustered transforma a tabela em heap, e todos os índices nonclustered
    existentes são reconstruídos como parte da operação de DROP, porque o localizador de linha
    deixa de ser a chave do clustered e passa a ser o RID. Os nonclustered não são removidos;
    isso só acontece com view indexada.
  verificado: sim
  escopo: um_trecho
  trivial_lexical: nao
- id: B03
  grupo: B
  pergunta_pt: Por que o comando DROP INDEX falha em um índice que foi criado automaticamente
    por uma constraint?
  pergunta_en: Why does DROP INDEX fail on an index that was created automatically by a constraint?
  tipo: multi_salto
  categoria: impacto
  saltos_esperados: 2
  justificativa_multihop: >
    A restrição está documentada no DROP INDEX, mas a solução — remover a constraint via ALTER
    TABLE — está em outro documento, assim como a explicação de que PRIMARY KEY e UNIQUE criam
    índices implicitamente.
  docs_candidatos:
  - t-sql/statements/drop-index-transact-sql.md
  - t-sql/statements/alter-table-transact-sql.md
  componentes:
  - nome: DROP INDEX não remove índice de constraint; usa-se ALTER TABLE ... DROP CONSTRAINT
    essencial: true
    trechos:
    - t-sql/statements/drop-index-transact-sql.md#chunk0
  chunks_ouro:
  - t-sql/statements/drop-index-transact-sql.md#chunk0
  chunks_apoio: []
  resposta_resumo: >
    DROP INDEX não se aplica a índices criados ao definir constraints PRIMARY KEY ou UNIQUE.
    Para remover a constraint e o índice correspondente, usa-se ALTER TABLE com a cláusula
    DROP CONSTRAINT.
  verificado: sim
  escopo: um_trecho
  trivial_lexical: sim
