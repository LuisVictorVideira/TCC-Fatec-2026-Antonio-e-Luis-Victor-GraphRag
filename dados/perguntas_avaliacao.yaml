  pergunta_pt: Que condições uma tabela precisa satisfazer para receber um índice columnstore
    clustered?
  pergunta_en: What conditions must a table meet before it can have a clustered columnstore
    index?
  tipo: multi_salto
  categoria: prerequisito
  saltos_esperados: 2
  justificativa_multihop: >
    As restrições de tipo de dado e de recursos incompatíveis estão em documento próprio de
    columnstore, separadas da sintaxe de criação.
  docs_candidatos:
  - relational-databases/indexes/columnstore-indexes-overview.md
  - t-sql/statements/create-columnstore-index-transact-sql.md
  componentes:
  - nome: tipos de dado que impedem o columnstore
    essencial: true
    trechos:
    - t-sql/statements/create-columnstore-index-transact-sql.md#chunk7
  - nome: recursos incompatíveis com o columnstore clustered
    essencial: true
    trechos:
