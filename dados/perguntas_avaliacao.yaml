    Usar a operação de índice online (ONLINE = ON): durante a fase principal só um bloqueio
    IS é mantido, e consultas e alterações continuam. Os requisitos são três. A edição do
    SQL Server precisa oferecer operações online, que não existem em todas. O índice clustered
    não pode ser criado, reconstruído ou removido online se a tabela tiver colunas LOB antigas
    (image, ntext, text) ou espaciais. E há exclusões, como índice XML, índice em tabela temporária
