    e às constraints de chave estrangeira?
  pergunta_en: What is the difference between DELETE and TRUNCATE TABLE regarding the transaction
    log and foreign key constraints?
  tipo: multi_salto
  categoria: comparacao
  saltos_esperados: 2
  justificativa_multihop: >
    Cada comando tem documento próprio, e a comparação exige combinar os dois.
  docs_candidatos:
  - t-sql/statements/truncate-table-transact-sql.md
  - t-sql/statements/delete-transact-sql.md
  componentes:
  - nome: 'log: DELETE registra cada linha; TRUNCATE só a desalocação das páginas'
    essencial: true
    trechos:
