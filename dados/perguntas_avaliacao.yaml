  - t-sql/statements/create-table-transact-sql.md#chunk2p4
  - t-sql/statements/create-xml-index-transact-sql.md#chunk2
  chunks_apoio: []
  resposta_resumo: >
    Liga o preenchimento das páginas de nível intermediário do índice: com PAD_INDEX = ON,
    o percentual de espaço livre definido pelo fill factor também é aplicado às páginas intermediárias,
    e não só às de nível folha. Com OFF (o padrão), as páginas intermediárias ficam quase
    cheias, com espaço para pelo menos uma linha do tamanho máximo. Só faz diferença junto
    com FILLFACTOR.
  verificado: sim
  escopo: um_trecho
  trivial_lexical: sim
