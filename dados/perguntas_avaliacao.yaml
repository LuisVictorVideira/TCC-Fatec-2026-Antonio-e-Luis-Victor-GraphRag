- id: A09
  grupo: A
  pergunta_pt: O que a opção PAD_INDEX faz?
  pergunta_en: What does the PAD_INDEX option do?
  tipo: um_salto
  categoria: fato
  saltos_esperados: 1
  justificativa_multihop: null
  docs_candidatos:
  - t-sql/statements/create-index-transact-sql.md
  componentes:
  - nome: aplica o espaço livre do fill factor às páginas intermediárias
    essencial: true
    trechos:
    - t-sql/statements/alter-index-transact-sql.md#chunk2p1
    - t-sql/statements/create-index-transact-sql.md#chunk2p1
    - t-sql/statements/alter-table-index-option-transact-sql.md#chunk2
    - t-sql/statements/create-spatial-index-transact-sql.md#chunk2
    - t-sql/statements/create-table-transact-sql.md#chunk2p4
