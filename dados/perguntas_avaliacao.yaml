  chunks_ouro:
  - t-sql/statements/create-columnstore-index-transact-sql.md#chunk7
  chunks_apoio:
  - relational-databases/track-changes/change-data-capture-and-other-sql-server-features.md#chunk7
  - t-sql/language-elements/declare-cursor-transact-sql.md#chunk5
  - relational-databases/indexes/columnstore-indexes-what-s-new.md#chunk5
  - t-sql/statements/create-columnstore-index-transact-sql.md#chunk3p1
  resposta_resumo: >
    A tabela não pode ter colunas de tipos que o columnstore não aceita: ntext, text e image;
    rowversion; sql_variant; tipos CLR, como hierarchyid e os espaciais; e xml. Os LOB varchar(max),
    nvarchar(max) e varbinary(max) só são aceitos a partir do SQL Server 2017, e só no columnstore
    clustered. Também não pode usar recursos incompatíveis: coluna computada persistida, compressão
    de página ou de linha, replicação, FILESTREAM, e ainda cursores e triggers na tabela com
    columnstore clustered. PRIMARY KEY, UNIQUE e FOREIGN KEY são permitidas, impostas por
    índices rowstore.
  verificado: sim
  escopo: um_trecho
  trivial_lexical: sim
