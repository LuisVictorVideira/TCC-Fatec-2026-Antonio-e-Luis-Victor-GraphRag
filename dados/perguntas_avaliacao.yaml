- id: A06
  grupo: A
  pergunta_pt: O que a cláusula DROP_EXISTING faz em uma operação de índice?
  pergunta_en: What does the DROP_EXISTING clause do in an index operation?
  tipo: um_salto
  categoria: fato
  saltos_esperados: 1
  justificativa_multihop: null
