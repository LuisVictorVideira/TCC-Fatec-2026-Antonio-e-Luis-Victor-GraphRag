- id: A03
  grupo: A
  pergunta_pt: Um DBA quer reduzir as divisões de página em inserções num índice existente.
    Que configuração trata disso, e quando ela passa a valer?
  pergunta_en: A DBA wants to reduce page splits on inserts into an existing index. Which
    setting addresses this, and when does it take effect?
  tipo: multi_salto
  categoria: impacto
  saltos_esperados: 2
  justificativa_multihop: >
    A seção de considerações de desempenho identifica o fator de preenchimento como resposta
    às divisões de página e dá a faixa recomendada; o momento em que o valor passa a valer
    — criação ou reconstrução do índice — está na introdução do documento.
  docs_candidatos:
  - relational-databases/indexes/specify-fill-factor-for-an-index.md
  componentes:
  - nome: o fator de preenchimento reduz as divisões de página, na faixa de 70 a 95 por cento
    essencial: true
    trechos:
    - relational-databases/indexes/specify-fill-factor-for-an-index.md#chunk1
  - nome: o valor só é aplicado na criação ou na reconstrução do índice
    essencial: true
    trechos:
    - relational-databases/indexes/specify-fill-factor-for-an-index.md#chunk0
  chunks_ouro:
  - relational-databases/indexes/specify-fill-factor-for-an-index.md#chunk1
  - relational-databases/indexes/specify-fill-factor-for-an-index.md#chunk0
  chunks_apoio:
  - t-sql/statements/create-index-transact-sql.md#chunk2p1
  - t-sql/statements/alter-index-transact-sql.md#chunk2p1
  - relational-databases/indexes/reorganize-and-rebuild-indexes.md#chunk1
  resposta_resumo: >
    O fator de preenchimento. Reservar espaço livre nas páginas de nível folha reduz as divisões
    de página; quando elas afetam o desempenho, a faixa indicada é de 70 a 95 por cento. O
    valor só é aplicado na criação ou na reconstrução do índice, e não é mantido conforme
    as linhas são inseridas — por isso, num índice existente, é preciso reconstruí-lo. A documentação
    ressalva que a maioria das cargas vai melhor com o padrão de 100 e que reduzir o fator
    aumenta espaço, memória e I/O.
  verificado: sim
  escopo: multi_trecho_mesmo_doc
  trivial_lexical: nao
- id: A04
  grupo: A
  pergunta_pt: Qual é o limite de tamanho da chave de um índice nonclustered no SQL Server
    2016 e posteriores?
  pergunta_en: What is the maximum key size for a nonclustered index in SQL Server 2016 and
    later?
  tipo: um_salto
  categoria: fato
  saltos_esperados: 1
  justificativa_multihop: null
  docs_candidatos:
  - t-sql/statements/create-index-transact-sql.md
  componentes:
  - nome: limite de 1.700 bytes para a chave do nonclustered, a partir do SQL Server 2016
    essencial: true
    trechos:
    - t-sql/statements/create-index-transact-sql.md#chunk11
  chunks_ouro:
  - t-sql/statements/create-index-transact-sql.md#chunk11
  chunks_apoio: []
  resposta_resumo: >
    1.700 bytes. O limite do índice clustered é 900 bytes, e antes do SQL Server 2016 era
    900 para os dois. Colunas incluídas (INCLUDE) não entram no cálculo do tamanho da chave.
  verificado: sim
  escopo: um_trecho
  trivial_lexical: sim
